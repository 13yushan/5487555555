<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地城迷蹤 - 回合制冒險</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            touch-action: manipulation;
        }
        .pixel-font {
            font-family: 'Press Start 2P', monospace;
        }
        .grid-cell {
            user-select: none;
            transition: all 0.1s ease;
        }
        /* Rainbow cycling animation for player */
        @keyframes rainbow {
            0% { color: #ef4444; text-shadow: 0 0 8px rgba(239, 68, 68, 0.9); }
            20% { color: #f59e0b; text-shadow: 0 0 8px rgba(245, 158, 11, 0.9); }
            40% { color: #10b981; text-shadow: 0 0 8px rgba(16, 185, 129, 0.9); }
            60% { color: #06b6d4; text-shadow: 0 0 8px rgba(6, 182, 212, 0.9); }
            80% { color: #a855f7; text-shadow: 0 0 8px rgba(168, 85, 247, 0.9); }
            100% { color: #ef4444; text-shadow: 0 0 8px rgba(239, 68, 68, 0.9); }
        }
        .rainbow-player {
            animation: rainbow 1.8s linear infinite;
            font-weight: 900;
        }
        .btn-touch {
            transition: transform 0.05s ease, background-color 0.1s;
        }
        .btn-touch:active {
            transform: scale(0.93);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-5 bg-gradient-to-br from-slate-950 via-slate-900 to-zinc-950">

    <header class="w-full max-w-md text-center my-1">
        <h1 class="pixel-font text-xl text-amber-400 tracking-wider drop-shadow-[0_2px_8px_rgba(245,158,11,0.5)]">地城迷蹤</h1>
        <p class="text-xs text-slate-400 font-medium mt-1">回合制冒險 · 隨機挑戰</p>
    </header>

    <!-- Main Game UI -->
    <main class="w-full max-w-md flex flex-col items-center gap-3">
        <!-- Status Display -->
        <div class="w-full bg-slate-900/90 border-2 border-slate-700 rounded-2xl p-3 flex justify-between items-center shadow-lg backdrop-blur">
            <div class="flex items-center gap-2">
                <span class="text-red-500 text-2xl animate-pulse">❤</span>
                <div>
                    <div class="text-[10px] text-slate-400 uppercase tracking-wider font-bold">生命值</div>
                    <div id="hp-display" class="pixel-font text-sm sm:text-base text-red-400">100 / 100</div>
                </div>
            </div>
            <div class="flex items-center gap-2 border-x border-slate-800 px-3">
                <div>
                    <div class="text-[10px] text-slate-400 uppercase tracking-wider text-center font-bold">回合</div>
                    <div id="turn-display" class="pixel-font text-sm sm:text-base text-amber-400 text-center">1</div>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div>
                    <div class="text-[10px] text-slate-400 uppercase tracking-wider text-right font-bold">地下城關卡</div>
                    <div id="level-display" class="pixel-font text-sm sm:text-base text-emerald-400 text-right">1 / 3</div>
                </div>
            </div>
        </div>

        <!-- Dungeon Display Grid -->
        <div class="w-full bg-slate-950 border-2 border-slate-800 rounded-2xl p-2 shadow-inner flex justify-center items-center overflow-hidden">
            <div id="dungeon-grid" class="grid gap-0 bg-slate-900 p-2 rounded-xl font-mono leading-none">
                <!-- Grid elements populated via JavaScript -->
            </div>
        </div>

        <!-- Touch Controls -->
        <div class="w-full bg-slate-900/80 border border-slate-700/80 rounded-2xl p-3 flex flex-col items-center gap-2 shadow-xl">
            <div class="text-[11px] text-slate-400 font-bold tracking-wide">方向操控 (WASD / 方向鍵 / 按鈕)</div>
            <div class="grid grid-cols-3 gap-2.5 w-60 sm:w-64">
                <div></div>
                <button id="btn-up" class="btn-touch bg-slate-800 hover:bg-slate-700 active:bg-amber-500 active:text-slate-950 text-slate-100 h-14 rounded-xl flex items-center justify-center text-2xl font-black shadow-md border-2 border-slate-600">▲</button>
                <div></div>
                <button id="btn-left" class="btn-touch bg-slate-800 hover:bg-slate-700 active:bg-amber-500 active:text-slate-950 text-slate-100 h-14 rounded-xl flex items-center justify-center text-2xl font-black shadow-md border-2 border-slate-600">◀</button>
                <button id="btn-wait" class="btn-touch bg-slate-800 hover:bg-slate-700 active:bg-amber-500 active:text-slate-950 text-amber-400 h-14 rounded-xl flex flex-col items-center justify-center text-xs font-bold shadow-md border-2 border-slate-600 pixel-font">等待</button>
                <button id="btn-right" class="btn-touch bg-slate-800 hover:bg-slate-700 active:bg-amber-500 active:text-slate-950 text-slate-100 h-14 rounded-xl flex items-center justify-center text-2xl font-black shadow-md border-2 border-slate-600">▶</button>
                <div></div>
                <button id="btn-down" class="btn-touch bg-slate-800 hover:bg-slate-700 active:bg-amber-500 active:text-slate-950 text-slate-100 h-14 rounded-xl flex items-center justify-center text-2xl font-black shadow-md border-2 border-slate-600">▼</button>
                <div></div>
            </div>
        </div>

        <!-- Action Control Buttons -->
        <div class="w-full flex gap-2">
            <button id="btn-restart" class="flex-1 bg-amber-500 hover:bg-amber-400 active:bg-amber-600 text-slate-950 font-bold py-3 px-4 rounded-xl shadow-lg transition text-sm pixel-font border-b-4 border-amber-700">重新開始</button>
            <button id="btn-help" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-3 px-5 rounded-xl shadow-lg transition text-xs border border-slate-600">說明</button>
        </div>
    </main>

    <!-- Modal: Help -->
    <div id="help-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl relative">
            <h3 class="pixel-font text-amber-400 text-base mb-4 text-center">遊戲指南</h3>
            <div class="text-sm text-slate-200 space-y-3 mb-6 leading-relaxed">
                <p><span class="rainbow-player text-base inline-block">@</span> : 玩家 (彩虹動態顯示)</p>
                <p><span class="text-red-500 font-bold text-base">E</span> : 巡邏敵人 (靠近會攻擊玩家造成 15 傷害)</p>
                <p><span class="text-purple-400 font-bold text-base">T</span> : 陷阱 (踩中扣除 15 HP)</p>
                <p><span class="text-cyan-400 font-bold text-base">+</span> : 治療泉水 (踩踏恢復 30 HP)</p>
                <p><span class="text-emerald-400 font-bold text-base">&gt;</span> : 地下城出口 (直達下一層，共有 3 層)</p>
            </div>
            <button id="btn-close-help" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-sm transition border-b-4 border-amber-700">我知道了</button>
        </div>
    </div>

    <!-- Modal: Game Over / Level Up / Victory -->
    <div id="game-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
            <h3 id="modal-title" class="pixel-font text-xl mb-3 text-amber-400">通關成功！</h3>
            <p id="modal-desc" class="text-sm text-slate-200 mb-6 leading-relaxed">進入下一層！</p>
            <button id="btn-modal-action" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs transition pixel-font shadow-lg border-b-4 border-amber-700">繼續前進</button>
        </div>
    </div>

    <footer class="text-[11px] text-slate-500 mt-2 font-bold">
        Retro Dungeon Crawler v3.0
    </footer>

    <script>
        const CONFIG = {
            width: 13,
            height: 11,
            maxHp: 100,
            playerAttack: 25,
            enemyHp: 30,
            enemyDamage: 15,
            trapDamage: 15,
            healAmount: 30,
            totalLevels: 3
        };

        let state = {
            level: 1,
            hp: CONFIG.maxHp,
            turns: 1,
            player: { x: 1, y: 1 },
            exit: { x: 11, y: 9 },
            enemies: [],
            traps: [],
            springs: [],
            grid: [],
            gameOver: false,
            won: false
        };

        function initGame() {
            state.hp = CONFIG.maxHp;
            state.turns = 1;
            state.level = 1;
            loadLevel(state.level);
            render();
        }

        function loadLevel(lvl) {
            state.gameOver = false;
            state.won = false;
            
            // Generate Grid Walls
            state.grid = [];
            for (let y = 0; y < CONFIG.height; y++) {
                let row = [];
                for (let x = 0; x < CONFIG.width; x++) {
                    if (x === 0 || x === CONFIG.width - 1 || y === 0 || y === CONFIG.height - 1) {
                        row.push(1); // Boundary wall
                    } else {
                        let isWall = false;
                        if (lvl === 1) {
                            if ((x === 4 && y > 1 && y < 7) || (x === 8 && y > 3 && y < 9)) {
                                isWall = true;
                            }
                        } else if (lvl === 2) {
                            if ((x === 3 && y % 2 === 1 && y < 8) || (y === 5 && x > 4 && x < 10)) {
                                isWall = true;
                            }
                        } else if (lvl === 3) {
                            if ((x === 3 || x === 9) && y > 1 && y < 8) {
                                isWall = true;
                            }
                            if (y === 5 && x > 4 && x < 8) {
                                isWall = true;
                            }
                        }
                        row.push(isWall ? 1 : 0);
                    }
                }
                state.grid.push(row);
            }

            state.player = { x: 1, y: 1 };
            state.grid[1][1] = 0;

            state.exit = { x: CONFIG.width - 2, y: CONFIG.height - 2 };
            state.grid[state.exit.y][state.exit.x] = 0;

            // Spawn Enemies
            state.enemies = [];
            let enemyCount = 2 + lvl; // L1:3, L2:4, L3:5
            for (let i = 0; i < enemyCount; i++) {
                let ex, ey;
                do {
                    ex = Math.floor(Math.random() * (CONFIG.width - 2)) + 1;
                    ey = Math.floor(Math.random() * (CONFIG.height - 2)) + 1;
                } while (
                    (ex === state.player.x && ey === state.player.y) || 
                    (ex === state.exit.x && ey === state.exit.y) || 
                    state.grid[ey][ex] === 1 ||
                    state.enemies.some(e => e.x === ex && e.y === ey)
                );
                state.enemies.push({ x: ex, y: ey, hp: CONFIG.enemyHp });
            }

            // Traps in Bottom-Right Quadrant
            state.traps = [];
            let trapCount = 2 + lvl;
            for (let i = 0; i < trapCount; i++) {
                let tx, ty;
                do {
                    tx = Math.floor(Math.random() * (CONFIG.width - Math.floor(CONFIG.width/2) - 1)) + Math.floor(CONFIG.width/2);
                    ty = Math.floor(Math.random() * (CONFIG.height - Math.floor(CONFIG.height/2) - 1)) + Math.floor(CONFIG.height/2);
                } while (
                    (tx === state.exit.x && ty === state.exit.y) || 
                    state.grid[ty][tx] === 1 ||
                    state.traps.some(t => t.x === tx && t.y === ty)
                );
                state.traps.push({ x: tx, y: ty, active: true });
            }

            // Healing Springs
            state.springs = [];
            let springCount = 2;
            for (let i = 0; i < springCount; i++) {
                let sx, sy;
                do {
                    sx = Math.floor(Math.random() * (CONFIG.width - 2)) + 1;
                    sy = Math.floor(Math.random() * (CONFIG.height - 2)) + 1;
                } while (
                    (sx === state.player.x && sy === state.player.y) || 
                    (sx === state.exit.x && sy === state.exit.y) || 
                    state.grid[sy][sx] === 1 ||
                    state.springs.some(s => s.x === sx && s.y === sy) ||
                    state.traps.some(t => t.x === sx && t.y === sy)
                );
                state.springs.push({ x: sx, y: sy, active: true });
            }
        }

        function render() {
            const gridEl = document.getElementById('dungeon-grid');
            gridEl.style.gridTemplateColumns = `repeat(${CONFIG.width}, minmax(0, 1fr))`;
            gridEl.innerHTML = '';

            for (let y = 0; y < CONFIG.height; y++) {
                for (let x = 0; x < CONFIG.width; x++) {
                    const cell = document.createElement('div');
                    cell.className = 'grid-cell w-6 h-6 sm:w-8 sm:h-8 flex items-center justify-center text-sm sm:text-base font-bold rounded';
                    
                    if (state.player.x === x && state.player.y === y) {
                        cell.textContent = '@';
                        cell.classList.add('rainbow-player', 'bg-slate-900', 'drop-shadow-lg');
                    } else if (state.exit.x === x && state.exit.y === y) {
                        cell.textContent = '>';
                        cell.classList.add('text-emerald-400', 'bg-emerald-950/60', 'animate-bounce');
                    } else if (state.enemies.some(e => e.x === x && e.y === y)) {
                        cell.textContent = 'E';
                        cell.classList.add('text-red-400', 'bg-red-950/50', 'drop-shadow-[0_0_6px_rgba(248,113,113,0.7)]');
                    } else {
                        let spring = state.springs.find(s => s.x === x && s.y === y && s.active);
                        let trap = state.traps.find(t => t.x === x && t.y === y && t.active);

                        if (spring) {
                            cell.textContent = '+';
                            cell.classList.add('text-cyan-300', 'bg-cyan-950/50', 'animate-pulse');
                        } else if (trap) {
                            cell.textContent = 'T';
                            cell.classList.add('text-purple-400', 'bg-purple-950/40');
                        } else if (state.grid[y][x] === 1) {
                            cell.textContent = '#';
                            cell.classList.add('text-slate-600', 'bg-slate-900/90');
                        } else {
                            cell.textContent = '.';
                            cell.classList.add('text-slate-700');
                        }
                    }
                    gridEl.appendChild(cell);
                }
            }

            // Display values
            const currentHp = Math.max(0, state.hp);
            document.getElementById('hp-display').textContent = `${currentHp} / ${CONFIG.maxHp}`;
            document.getElementById('turn-display').textContent = state.turns;
            document.getElementById('level-display').textContent = `${state.level} / ${CONFIG.totalLevels}`;
        }

        function movePlayer(dx, dy) {
            if (state.gameOver || state.won) return;

            const newX = state.player.x + dx;
            const newY = state.player.y + dy;

            if (newX < 0 || newX >= CONFIG.width || newY < 0 || newY >= CONFIG.height) return;
            if (state.grid[newY][newX] === 1) return; // Wall collision

            let attackPerformed = false;

            // Combat Check when attacking enemy
            let targetEnemyIndex = state.enemies.findIndex(e => e.x === newX && e.y === newY);
            if (targetEnemyIndex !== -1) {
                let enemy = state.enemies[targetEnemyIndex];
                enemy.hp -= CONFIG.playerAttack;
                attackPerformed = true;

                if (enemy.hp <= 0) {
                    // Enemy defeated
                    state.enemies.splice(targetEnemyIndex, 1);
                } else {
                    // Enemy retaliates immediately if not defeated
                    state.hp -= CONFIG.enemyDamage;
                }
            } else {
                // Move player if space is clear
                state.player.x = newX;
                state.player.y = newY;
            }

            state.turns++;

            // Healing spring check
            if (!attackPerformed) {
                let springIndex = state.springs.findIndex(s => s.x === state.player.x && s.y === state.player.y && s.active);
                if (springIndex !== -1) {
                    state.springs[springIndex].active = false;
                    state.hp = Math.min(CONFIG.maxHp, state.hp + CONFIG.healAmount);
                }

                // Trap trigger check
                let trapIndex = state.traps.findIndex(t => t.x === state.player.x && t.y === state.player.y && t.active);
                if (trapIndex !== -1) {
                    state.traps[trapIndex].active = false;
                    state.hp -= CONFIG.trapDamage;
                }
            }

            // Exit Check
            if (state.player.x === state.exit.x && state.player.y === state.exit.y) {
                if (state.level < CONFIG.totalLevels) {
                    state.level++;
                    loadLevel(state.level);
                    render();
                    showModal('🌟 順利過關！', `你進入了第 ${state.level} 層地下城！準備迎接新的挑戰！`, false, true);
                    return;
                } else {
                    state.won = true;
                    render();
                    showModal('🏆 獲得最終勝利！', `恭喜！你成功闖過全部 3 層地下城，總共耗費 ${state.turns} 回合！`, true);
                    return;
                }
            }

            // Check if player died from trap/counterattack
            if (state.hp <= 0) {
                handleGameOver();
                return;
            }

            // Enemies Turn (Wandering & Attacking)
            updateEnemies();

            render();

            // Check if player died from wandering enemies
            if (state.hp <= 0) {
                handleGameOver();
            }
        }

        function updateEnemies() {
            state.enemies.forEach(enemy => {
                const distX = state.player.x - enemy.x;
                const distY = state.player.y - enemy.y;
                const distance = Math.abs(distX) + Math.abs(distY);

                // If adjacent to player, attack player directly
                if (distance === 1) {
                    state.hp -= CONFIG.enemyDamage;
                    return;
                }

                // Move towards player if nearby
                let dx = 0, dy = 0;
                if (distance <= 4) {
                    if (Math.abs(distX) > Math.abs(distY)) {
                        dx = distX > 0 ? 1 : -1;
                    } else {
                        dy = distY > 0 ? 1 : -1;
                    }
                }

                const nextX = enemy.x + dx;
                const nextY = enemy.y + dy;

                if (
                    nextX >= 0 && nextX < CONFIG.width &&
                    nextY >= 0 && nextY < CONFIG.height &&
                    state.grid[nextY][nextX] === 0 &&
                    !(nextX === state.player.x && nextY === state.player.y) &&
                    !state.enemies.some(e => e !== enemy && e.x === nextX && e.y === nextY)
                ) {
                    enemy.x = nextX;
                    enemy.y = nextY;
                }
            });
        }

        function handleGameOver() {
            state.gameOver = true;
            state.hp = 0;
            render();
            showModal('💀 冒險失敗！', `你在第 ${state.level} 層不幸戰死。請整理裝備重新挑戰！`, true);
        }

        function showModal(title, desc, isEndGame = false, isNextLevel = false) {
            const modal = document.getElementById('game-modal');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-desc').textContent = desc;
            const btn = document.getElementById('btn-modal-action');
            
            if (isNextLevel) {
                btn.textContent = '進入下一層 ➔';
                btn.onclick = () => { modal.classList.add('hidden'); };
            } else if (isEndGame) {
                btn.textContent = '重新開始 🔄';
                btn.onclick = () => { modal.classList.add('hidden'); initGame(); };
            }
            modal.classList.remove('hidden');
        }

        // Keyboard Controls
        window.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); movePlayer(0, -1); }
            if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); movePlayer(0, 1); }
            if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); movePlayer(-1, 0); }
            if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); movePlayer(1, 0); }
            if (['Space', 'KeyX'].includes(e.code)) { e.preventDefault(); movePlayer(0, 0); }
        });

        // Touch Control Listeners
        document.getElementById('btn-up').addEventListener('click', () => movePlayer(0, -1));
        document.getElementById('btn-down').addEventListener('click', () => movePlayer(0, 1));
        document.getElementById('btn-left').addEventListener('click', () => movePlayer(-1, 0));
        document.getElementById('btn-right').addEventListener('click', () => movePlayer(1, 0));
        document.getElementById('btn-wait').addEventListener('click', () => movePlayer(0, 0));

        document.getElementById('btn-restart').addEventListener('click', () => initGame());

        const helpModal = document.getElementById('help-modal');
        document.getElementById('btn-help').addEventListener('click', () => helpModal.classList.remove('hidden'));
        document.getElementById('btn-close-help').addEventListener('click', () => helpModal.classList.add('hidden'));

        window.onload = () => {
            initGame();
        };
    </script>
</body>
</html>
